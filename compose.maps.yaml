services:
  tileserver:
    image: maptiler/tileserver-gl:v4.11.0
    command: ["-c", "/config/config.json"]
    volumes:
      - ./infra/maps/tileserver/config.json:/config/config.json:ro
      - ./infra/maps/tileserver/styles:/config/styles:ro
      - ./infra/maps/tileserver/data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: ["osrm-routed", "--algorithm", "mld", "/data/map.osrm"]
    volumes:
      - ./infra/maps/osrm/data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "cat < /dev/null > /dev/tcp/127.0.0.1/5000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nominatim:
    image: mediagis/nominatim:5.3
    environment:
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
    volumes:
      - nominatim_data:/var/lib/postgresql/16/main
      - ./infra/maps/nominatim/data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  nominatim_data:
